workflows:
  android-workflow:
   android-apk:
     name: Samsungify
     max_build_duration: 120

    environment:
      java: 17
    scripts:
      - name: Check Java
        script: |
          echo "$JAVA_HOME"
          java -version


    scripts:
      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
